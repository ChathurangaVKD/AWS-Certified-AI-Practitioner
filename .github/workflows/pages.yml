name: Deploy exam simulator to GitHub Pages
on:
  push:
    branches: [main]
    paths: [exam-simulator/**, docs/mock-exam.md, docs/full-length-mock-exam.md]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 exam-simulator/build_questions.py
      - run: mkdir _site && cp exam-simulator/index.html exam-simulator/questions.js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
