# SonarQube/SonarCloud scanner configuration for
# AWS-Certified-AI-Practitioner.
#
# Why this file exists: analysis was failing with "No SonarQube token
# configured (SecretOverride SONAR_TOKEN / env SONAR_TOKEN both empty)".
# That specific error is a CI/secrets-store problem — SONAR_TOKEN has to be
# injected by the autopilot pipeline's secret store at scan time — and
# can't be fixed by anything committed to this repo. This repo has no
# access to that vault, and committing a hardcoded token (or any other way
# of making the scan "succeed") would just trade a loud, honest failure for
# a silently fake result. So this file deliberately does NOT set
# sonar.login/sonar.token/sonar.password.
#
# What *is* in this repo's control, and what was actually missing before
# this file existed: real scanner configuration. Without it, even a
# correctly-authenticated run would have fallen back to scanning the whole
# working directory with no declared project identity. This declares that
# up front so the day SONAR_TOKEN is provisioned, the scan runs correctly
# on the first try.
#
# This repo is a generated documentation series (study guide Markdown under
# docs/), not an application — there is no application source code and no
# test suite to split out, so sonar.sources simply covers the whole repo
# and non-content directories are excluded.

sonar.projectKey=AWS-Certified-AI-Practitioner
sonar.projectName=AWS Certified AI Practitioner (AIF-C01) Study Guide

sonar.sources=.
sonar.exclusions=**/.git/**

sonar.sourceEncoding=UTF-8
